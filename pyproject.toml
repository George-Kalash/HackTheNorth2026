[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "prediction-terminal"
version = "0.2.0"
description = "Local read-only cross-venue prediction market research terminal"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "websockets>=14,<17", "cryptography>=44,<49"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "playwright>=1.49,<2"]
[tool.hatch.build.targets.wheel]
packages = ["src/prediction_terminal"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration", "tests/replay"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
files = ["src/prediction_terminal"]
