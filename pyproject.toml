[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketlens"
version = "0.1.0"
description = "Compare prediction-market contracts across Kalshi and Polymarket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketlens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
