services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: terminal
      POSTGRES_DB: terminal
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      PT_DATABASE_URL: postgresql+psycopg://terminal:terminal@db:5432/terminal
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      PT_DATABASE_URL: postgresql+psycopg://terminal:terminal@db:5432/terminal
    ports: ["127.0.0.1:8010:8010"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      PT_DATABASE_URL: postgresql+psycopg://terminal:terminal@db:5432/terminal
    command: ["uv", "run", "--no-dev", "python", "-m", "prediction_terminal.workers.main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres_data:
