name: local-terminal-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: terminal, POSTGRES_PASSWORD: terminal, POSTGRES_DB: terminal}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U terminal"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: make setup lint typecheck test build
      - run: uv run alembic upgrade head
        env: {PT_DATABASE_URL: 'postgresql+psycopg://terminal:terminal@localhost:5432/terminal'}
      - run: make types && git diff --exit-code -- web/src/services/generated/api.d.ts
